next_node_id = "200"

[[nodes]]
id = "7"
type = "random_roll"
text = """Illustration I
まるで永遠にも思える時間、群衆の奔流に、速い川の上の葉のように流される。
足元を必死に保とうとするが、試練で弱り、めまいがし、足は鉛のように重い。
突然、細長い石の階段が宿屋の屋根に続くのが見える。
最後の力を振り絞り、階段に飛びつき、ゆっくりと登る。
そこからホルムガードの屋根や尖塔の壮麗な景色が見え、城塞の高く輝く石壁が陽光に映える。
首都の家や建物は互いに密接に建ち、屋根から屋根へ飛び移ることが可能だ。
実際、ホルムガードの市民は、秋の豪雨で舗装されていない道が泥だらけになると、「ルーフウェイ」と呼ばれるこの経路を使っていた。
しかし多くの事故の後、王の布告でその使用は禁じられた。
熟慮の末、王にたどり着く唯一の手段として「ルーフウェイ」を使うことにする。
数々の通りを飛び、跳ね、飛んで、城塞まであと一つの通りというところに来る。
次の屋根への跳躍は、これまで試みたどの距離よりも遠い。胃が蝶でいっぱいになるような感覚だ。
城塞に到達する決意を固め、長い助走をつける。
耳に血が脈打つ音を聞きながら、屋根の端まで疾走し、対岸の屋根に目を固定して宙へ跳ぶ。
ランダムナンバーテーブルから数字を一つ選べ。"""
[[nodes.choices]]
description = "もし選んだ数字が0～2なら、108へ進め。"
next_node_id = "108"

[[nodes.choices]]
description = "もし選んだ数字が3～9なら、25へ進め。"
next_node_id = "25"

