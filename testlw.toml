[[nodes]]
id = "1"
type = "story"
text = """急がねばならぬ。焼け落ちた修道院の煙る廃墟に長居するのは危険だと、第六の感覚が告げている。
黒い翼を持つ獣たちが、いつまた戻ってくるかもしれぬ。ソムレンディングの首都ホルムガードへ急ぎ、王にこの恐ろしい惨劇を伝えねばならぬ。カイの精鋭戦士たちが、君を除いて皆殺しにされたのだ。
カイの領主がいなければ、ソマーランドの軍は古の敵、ダークロードの手に落ちるだろう。
涙をこらえ、死にゆく仲間たちに別れを告げる。心の中で、静かに彼らの仇を討つと誓う。
廃墟に背を向け、険しい坂道を慎重に下る。
丘のふもとで、道は二手に分かれ、どちらも大きな森へと続いている。"""
[[nodes.choices]]
description = "もしカイの第六の感覚の技を使いたいなら、141へ進め。"
next_node_id = "141"
required_discipline = "Sixth Sense"

[[nodes.choices]]
description = "もし森へ続く右の道を選ぶなら、85へ進め。"
next_node_id = "85"

[[nodes.choices]]
description = "もし左の道を進むなら、275へ進め。"
next_node_id = "275"

