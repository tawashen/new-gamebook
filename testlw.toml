next_node_id = "144"

[[nodes]]
id = "4"
type = "story"
text = """それは小さな一人乗りのカヌーで、ひどく傷んでいる。
木材は割れ、反っており、いたるところから水が漏れているようだ。
急いで粘土でひどい穴を塞ぎ、水をかき出す。
これでひとまずは漏れが止まったようだ。装備を船首に収め、流木を櫂代わりにして川を下り始める。
しばらくすると、左岸から馬が疾走する音が聞こえてくる。"""
[[nodes.choices]]
description = "もしカイの第六の感覚の技を使いたいなら、218へ進め。"
