type = "story"
text = """遠くで馬が駆ける音が聞こえてくる。
木の陰に身を潜め、騎手たちが近づくのを待つ。
彼らは国王衛兵の騎兵で、陛下の軍の白い制服を着ている。"""
[[nodes.choices]]
description = "もし彼らを呼びたいなら、183へ進め。"
next_node_id = "183"

[[nodes.choices]]
