[[nodes]]
id = "3"
type = "story"
text = """将校の後ろにぴたりと寄り添い、拱門をくぐり、短い階段を上って長い廊下へと進む。
兵士たちが、華やかな巻物に記された命令を手に、城壁に配置された将校たちへと走り回る。
傷だらけのやつれた男が、白と紫の王宮のローブをまとい、近づいてくる。彼は君に、王の城塞へついてくるよう促す。"""
[[nodes.choices]]
description = "もしこの男についていくなら、196へ進め。"
next_node_id = "196"

[[nodes.choices]]
