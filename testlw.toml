武器を手に、密な葉の陰に身を潜め、空き地の縁に移動し、守備者を見ようとする。驚くことに、遺跡を守るのは君と同い年ほどの若者だ。星の刺繍が施された空色のローブから、トランの魔法使いギルドの若き術者、魔法の見習いだと分かる。
