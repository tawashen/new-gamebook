[[nodes]]
id = "5"
type = "story"
text = """約一時間の歩行の後、道は徐々に東に曲がっていく。
浅い渡渉点にたどり着く。そこでは急な岩だらけの道を、速い流れの小川が南へ向かって流れている。
渡渉点のすぐ先には交差点があり、道が南北に走るより広い道と交差している。
北へ向かう道は首都から遠ざかることを悟り、交差点で右に曲がり、南へ進む。"""
[[nodes.choices]]
description = "111へ進め。"
next_node_id = "111"

[[nodes]]
