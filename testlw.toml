[[nodes]]
id = "349"
title = "Paragraph 349"
description = """金髪の若い男で、深い思索の瞳を持つ。顔は疲労と戦いの汚れに刻まれ、空色の長いローブは野で暮らした証だ。手を振って握り、頭を下げる。「永遠の感謝を、カイの領主。私の力はほぼ尽きた。君の助けがなければ、ギアクの槍の上で終わっていただろう。」
彼は弱り、足元が不安定だ。腕を支え、倒れた柱に座らせ、彼の言葉に耳を傾ける。
「私の名はバネドン。クリスタル・スターの同胞団、トランの魔法使いギルドの徒弟だ。ギルドマスターがこの急務の伝言を君の修道院に送った。」彼はローブから羊皮紙の封筒を出し、渡す。
「ご覧の通り、封を切り、内容を読んだ。戦争が始まり、2人の旅の仲間と街道にいた。クラーンに襲われ、逃げる中、森で離れた。」
手紙はダークロードがダーンクラグ山脈の向こうに大軍を集めた警告だ。ギルドマスターはフェーマンの祝祭を中止し、戦争の準備をカイに促す。
「我々は裏切られた」とバネドンが悲しげに頭を下げる。
「我々の同胞、ヴォノターが黒魔術の禁断の謎を探り、10日前、同胞団を非難し、長老を殺した。彼は消え、ダークロードを助けていると噂される。」
君は修道院の出来事と王に警告する任務を告げる。静かに、バネドンは首の金の鎖を外し、渡す。鎖には小さなクリスタル・スターのペンダントがある。「私の同胞団の象徴だ。この暗黒の時に我々は真の兄弟だ。幸運の護符—これからの道を守るように。」君は感謝し、鎖を首にかけ、ペンダントを服にしまう。（アクションチャートに記録せよ。）
バネドンが別れを告げる。「ギアクが卑劣な仲間を連れて戻る前に去らねばならぬ。私はギルドに戻る。さらば、兄弟。神の幸運が共にあらんことを。」"""
[[nodes.outcomes]]
next_node_id = "293"

[[nodes]]
id = "350"
title = "Paragraph 350"
description = """国家の間に入ると、白と金で豪華に飾られた壮麗な広間だ。王と側近が中央の大理石の台に広げた大きな地図を吟味し、顔は心配と集中に刻まれる。君が同胞の死と城塞への危険な旅を語ると、広間に静寂が満ちる。物語を終えると、王が近づき、君の右手を握る。
「ローン・ウルフ、君は無私の勇気を持つ。真のカイの領主の資質だ。この危険な旅は大きな痛手だが、君の決意の精神は暗黒の時に我々に希望の光だ。君は師の記憶に大いなる名誉をもたらした。それを称える。」
広間全体の称賛と心からの感謝を受け、若々しい顔が赤らむ。王が手を上げ、声が止まる。
「君はソマーランドが忠実な子に求める全てを果たしたが、なお必要だ。ダークロードが再び力を増し、その野望に限界はない。我々の希望はデュレノールにあり、かつてダークロードを破った力にある。ローン・ウルフ、君は最後のカイだ—技を持つ。デュレノールへ旅し、太陽の剣ソマースウェルドを持ち帰るか？神の贈り物でこの悪を打ち砕き、祖国を救うのだ。」
ソマースウェルドの探索を受け入れるなら、ローン・ウルフ冒険の第2巻『Fire on the Water』で冒険を始めなさい。"""
[[nodes.options]]
